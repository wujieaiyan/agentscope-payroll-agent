spring:
  application:
    name: payroll-agent-runtime
  profiles:
    # 本地默认走 MySQL；容器与部门部署仍通过 SPRING_PROFILES_ACTIVE 覆盖。
    active: "${SPRING_PROFILES_ACTIVE:mysql}"
  config:
    import: classpath:application-common.yml
  main:
    web-application-type: servlet

server:
  port: "${PAYROLL_AGENT_PORT:8100}"

payroll:
  # 运行期只提供 /internal/**，不暴露管理台接口。
  node-role: "${PAYROLL_NODE_ROLE:runtime}"
