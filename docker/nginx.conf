upstream payroll_web {
    least_conn;
    server web-1:8080;
    server web-2:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带指纹的构建产物可长期缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 与 SSE：关闭缓冲，事件逐条到达浏览器；续流接口最长等待 30 分钟。
    # 轮次硬上限 30 分钟，读超时须大于它，否则 nginx 会先于服务端断开长回答。
    location /api/ {
        proxy_pass http://payroll_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /actuator/ {
        proxy_pass http://payroll_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # 编排探针薄别名：与 /actuator/health/{liveness,readiness} 等价，不带详情。
    location = /livez {
        proxy_pass http://payroll_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /readyz {
        proxy_pass http://payroll_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # 前端路由使用 history 模式，未知路径回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
