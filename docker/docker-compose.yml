# 三镜像多节点演练：前端(Nginx) + 2 个 Web 后端 + 2 个 agent-runtime + MySQL + Redis + Ollama + 沙箱。
# 用法：
#   mvn -DskipTests package
#   docker build -f docker/sandbox-runtime.Dockerfile -t payroll-sandbox-runtime:local .
#   docker build -f docker/sandbox-init.Dockerfile -t payroll-sandbox-init:local .
#   docker compose -f docker/docker-compose.yml up -d --build
#   浏览器访问 http://127.0.0.1:18088
# 生产形态：叠加 docker/docker-compose.prod.yml（prod profile + 容器内 ES + 必填凭证密钥），
#   本文件保持默认演示档：启动守卫以 warn 运行、只告警不阻断，见 docs/deployment-matrix.md。
# 说明：
#   - frontend 镜像托管 Vue3 产物，/api 与 /actuator 反向代理到两个 Web 节点。
#   - Web 无状态，登录态与轮次状态在 MySQL/Redis，Nginx 轮询且无粘性。
#   - runtime 只在容器网络内暴露 8100，对外不可达。
#   - Web/runtime 共享 kb-data（知识库文件）与 output-data（导出文件），避免多实例各写本地。
#   - parser 独占 PDF/OCR 重活：只读 kb-data，产物写 parsed-data；Web 以 remote 模式调用并只读产物。
#   - 模型由 compose 内的 Ollama 提供，直接挂载宿主机模型目录（只读），无需宿主机 Ollama。
#   - sandbox 通过 docker.sock 启动一次性脚本容器；work 目录在宿主机与容器内保持同一绝对路径，
#     否则宿主机 Docker 看不到脚本 bind 源。脚本容器本身禁网、只读、非 root、限额运行。
#   - 技能数据初始化使用独立 init 镜像（允许联网），工作区在 work 目录下的 skills/，
#     可用 PAYROLL_SANDBOX_SKILL_ROOT 覆盖；初始化后的 data/ 以只读方式挂到运行容器的 /data。

name: payroll-multinode

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: mysql,redis
  PAYROLL_SERVER_ADDRESS: 0.0.0.0
  PAYROLL_DB_URL: jdbc:mysql://mysql:3306/payroll?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
  PAYROLL_DB_USER: ${PAYROLL_DB_USER:-payroll}
  PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:-payroll}
  PAYROLL_REDIS_HOST: redis
  PAYROLL_REDIS_PORT: "6379"
  # 容器内 127.0.0.1 指向自身，宿主机上的 Nacos 需经 host-gateway 访问。
  PAYROLL_NACOS_SERVER: ${PAYROLL_NACOS_SERVER:-http://host.docker.internal:8848}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  PAYROLL_MODEL: ${PAYROLL_MODEL:-ollama:qwen2.5:3b-instruct}
  PAYROLL_ADMIN_PASSWORD: ${PAYROLL_ADMIN_PASSWORD:-admin123}
  # 演示档只告警不阻断；生产形态（compose.prod）显式切 fail。
  PAYROLL_GUARD_STRICT: ${PAYROLL_GUARD_STRICT:-warn}
  # 容器内不部署 ES：关闭长记忆、语义缓存与知识库索引，避免健康检查与写入失败。
  PAYROLL_MEMORY_ENABLED: "false"
  PAYROLL_MEMORY_ES_URL: ${PAYROLL_MEMORY_ES_URL:-http://host.docker.internal:9200}
  PAYROLL_SEMANTIC_CACHE_ENABLED: "false"
  PAYROLL_KB_ES_ENABLED: "false"
  MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
  # Web 与 runtime 共用同一 HMAC 密钥。
  PAYROLL_AGENT_RUNTIME_TOKEN: ${PAYROLL_AGENT_RUNTIME_TOKEN:-local-demo-token-change-me}
  # Web 与 parser 共用的解析内部接口密钥；为空时 parser 启动失败。
  PAYROLL_PARSE_TOKEN: ${PAYROLL_PARSE_TOKEN:-local-parse-token-change-me}
  # 技能脚本执行：runtime 经内部 HMAC 调用沙箱服务。
  PAYROLL_SANDBOX_URL: ${PAYROLL_SANDBOX_URL:-http://sandbox:8200}
  PAYROLL_SANDBOX_TOKEN: ${PAYROLL_SANDBOX_TOKEN:-local-sandbox-token-change-me}
  PAYROLL_SKILL_EXEC_ENABLED: "true"
  TZ: Asia/Shanghai

x-app: &app
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    ollama:
      condition: service_healthy
  # liveness 只反映进程自身状态，不含外部依赖；各服务用 PAYROLL_HEALTHCHECK_PORT 指到自己的端口。
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PAYROLL_HEALTHCHECK_PORT}/actuator/health/liveness"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 90s

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payroll
      MYSQL_USER: ${PAYROLL_DB_USER:-payroll}
      MYSQL_PASSWORD: ${PAYROLL_DB_PASSWORD:-payroll}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction：轮次事件流与租约键不能被 LRU 提前淘汰，否则续流会出现空洞。
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 复用宿主机已下载的模型，避免容器内重复拉取；目录只读挂载。
  ollama:
    image: ollama/ollama:0.12.11
    restart: unless-stopped
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${PAYROLL_OLLAMA_MODELS_DIR:-/mnt/d/ollma}:/models:ro
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 独立解析进程：PDF 渲染与扫描页 OCR 在此执行，避免拖垮 Web。
  # 只读挂载 kb-data 读取源文件，自有 parsed-data 落解析产物；Web 以只读方式读取产物。
  parser:
    image: payroll-parser:local
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/parser.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      PAYROLL_PARSER_PORT: "8300"
      PAYROLL_PARSE_TOKEN: ${PAYROLL_PARSE_TOKEN:-local-parse-token-change-me}
      # 源文件目录须与 Web 的 kb.storage-dir 一致（同为 kb-data 卷）。
      PAYROLL_KB_STORAGE_DIR: /app/data/kb-uploads
      PAYROLL_KB_PARSE_ARTIFACT_DIR: /app/parsed
      PAYROLL_KB_PARSE_MAX_PAGES: "200"
      PAYROLL_PARSER_WORKERS: "2"
      PAYROLL_KB_OCR_ENABLED: "true"
      PAYROLL_KB_OCR_LANGUAGES: "chi_sim+eng"
      # 单文档解析总时长上限：200 页扫描件按 15 分钟给足预算。
      PAYROLL_KB_PARSE_TIMEOUT_MS: "900000"
      TZ: Asia/Shanghai
    expose:
      - "8300"
    volumes:
      - kb-data:/app/data:ro
      - parsed-data:/app/parsed
    mem_limit: 2.5g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8300/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  runtime-1:
    <<: *app
    image: payroll-runtime:local
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
    environment:
      <<: *app-env
      PAYROLL_NODE_ROLE: runtime
      PAYROLL_NODE_ID: runtime-1
      PAYROLL_AGENT_PORT: "8100"
      PAYROLL_HEALTHCHECK_PORT: "8100"
      # 知识库配置工具经签名内部接口由 Web 节点执行，runtime 需要 Web 地址。
      PAYROLL_KB_SKILL_ENABLED: "true"
      PAYROLL_WEB_NODE_URLS: http://web-1:8080,http://web-2:8080
    expose:
      - "8100"
    mem_limit: 4g
    volumes:
      - kb-data:/app/data
      - output-data:/app/output

  runtime-2:
    <<: *app
    image: payroll-runtime:local
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
    environment:
      <<: *app-env
      PAYROLL_NODE_ROLE: runtime
      PAYROLL_NODE_ID: runtime-2
      PAYROLL_AGENT_PORT: "8100"
      PAYROLL_HEALTHCHECK_PORT: "8100"
      PAYROLL_KB_SKILL_ENABLED: "true"
      PAYROLL_WEB_NODE_URLS: http://web-1:8080,http://web-2:8080
    expose:
      - "8100"
    mem_limit: 4g
    volumes:
      - kb-data:/app/data
      - output-data:/app/output

  web-1:
    <<: *app
    image: payroll-backend:local
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *app-env
      PAYROLL_NODE_ROLE: web
      PAYROLL_NODE_ID: web-1
      PAYROLL_WEB_PORT: "8080"
      PAYROLL_HEALTHCHECK_PORT: "8080"
      PAYROLL_AGENT_RUNTIME_URLS: http://runtime-1:8100,http://runtime-2:8100
      # 解析走独立进程；产物只读挂载，Web 不再做 PDF 渲染/OCR。
      PAYROLL_KB_PARSE_MODE: remote
      PAYROLL_KB_PARSE_URL: http://parser:8300
      PAYROLL_KB_PARSE_ARTIFACT_DIR: /app/parsed
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      parser:
        condition: service_healthy
    expose:
      - "8080"
    mem_limit: 2g
    volumes:
      - kb-data:/app/data
      - parsed-data:/app/parsed:ro
      - output-data:/app/output

  web-2:
    <<: *app
    image: payroll-backend:local
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      <<: *app-env
      PAYROLL_NODE_ROLE: web
      PAYROLL_NODE_ID: web-2
      PAYROLL_WEB_PORT: "8080"
      PAYROLL_HEALTHCHECK_PORT: "8080"
      PAYROLL_AGENT_RUNTIME_URLS: http://runtime-1:8100,http://runtime-2:8100
      PAYROLL_KB_PARSE_MODE: remote
      PAYROLL_KB_PARSE_URL: http://parser:8300
      PAYROLL_KB_PARSE_ARTIFACT_DIR: /app/parsed
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      parser:
        condition: service_healthy
    expose:
      - "8080"
    mem_limit: 2g
    volumes:
      - kb-data:/app/data
      - parsed-data:/app/parsed:ro
      - output-data:/app/output

  # 脚本沙箱调度器：通过 docker.sock 起一次性容器；脚本目录以同一绝对路径挂载，宿主机可见。
  sandbox:
    image: payroll-sandbox:local
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/sandbox.Dockerfile
    environment:
      PAYROLL_SANDBOX_TOKEN: ${PAYROLL_SANDBOX_TOKEN:-local-sandbox-token-change-me}
      PAYROLL_SANDBOX_SCRIPT_IMAGE: ${PAYROLL_SANDBOX_SCRIPT_IMAGE:-payroll-sandbox-runtime:local}
      PAYROLL_SANDBOX_MAX_CONCURRENCY: "4"
      PAYROLL_SANDBOX_WORK_DIR: ${PAYROLL_SANDBOX_WORK_DIR:-/tmp/payroll-sandbox-work}
      # 技能工作区（<root>/<id>/data）与 init 镜像；路径须与宿主机一致，嵌套的 docker run 才能 bind。
      PAYROLL_SANDBOX_SKILL_ROOT: ${PAYROLL_SANDBOX_SKILL_ROOT:-/tmp/payroll-sandbox-work/skills}
      PAYROLL_SANDBOX_INIT_IMAGE: ${PAYROLL_SANDBOX_INIT_IMAGE:-payroll-sandbox-init:local}
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PAYROLL_SANDBOX_WORK_DIR:-/tmp/payroll-sandbox-work}:${PAYROLL_SANDBOX_WORK_DIR:-/tmp/payroll-sandbox-work}
      - ${PAYROLL_SANDBOX_SKILL_ROOT:-/tmp/payroll-sandbox-work/skills}:${PAYROLL_SANDBOX_SKILL_ROOT:-/tmp/payroll-sandbox-work/skills}
    expose:
      - "8200"
    mem_limit: 1g

  frontend:
    image: payroll-frontend:local
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
    ports:
      - "18088:80"

volumes:
  mysql-data:
  redis-data:
  kb-data:
  parsed-data:
  output-data:
