server:
  # 默认只监听本机；部门部署通过 PAYROLL_SERVER_ADDRESS=0.0.0.0 放开。
  address: "${PAYROLL_SERVER_ADDRESS:127.0.0.1}"
  shutdown: graceful
  tomcat:
    # 请求超过 multipart 上限时仍读完剩余请求体，保证客户端收到 413 而不是连接被重置。
    max-swallow-size: "${PAYROLL_UPLOAD_MAX_SWALLOW_SIZE:-1}"

spring:
  profiles:
    # 部门级部署：--spring.profiles.active=dept 同时启用 MySQL 与 Redis。
    group:
      dept: mysql,redis
  # 向量库客户端由 PayrollConfiguration 手动创建，禁用 Boot 的 ES 自动装配。
  # Redis 相关自动装配默认关闭，仅在 redis profile 中放开，避免本地/测试强依赖 Redis。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0
  servlet:
    multipart:
      # 知识库上传等场景；单文件上限需与 payroll.kb.max-file-size 保持一致。
      max-file-size: "${PAYROLL_UPLOAD_MAX_FILE_SIZE:600MB}"
      max-request-size: "${PAYROLL_UPLOAD_MAX_REQUEST_SIZE:1GB}"
  lifecycle:
    timeout-per-shutdown-phase: 10s

payroll:
  # legacy=手写三阶段状态机；graph=langgraph4j 图编排（POC，仅切换路由层）
  orchestrator: "${PAYROLL_ORCHESTRATOR:legacy}"
  # all=单进程（默认）；web=只做鉴权/转发/SSE；runtime=只执行内部轮次。
  node-role: "${PAYROLL_NODE_ROLE:all}"
  node-id: "${PAYROLL_NODE_ID:local}"
  runtime:
    # Web 调用的 runtime 地址，逗号分隔；为空时 Web 节点无法执行模型，对话接口返回明确错误。
    urls: "${PAYROLL_AGENT_RUNTIME_URLS:}"
  internal:
    # runtime 内部接口 HMAC 密钥；null/空时内部提交不可用。
    token: "${PAYROLL_AGENT_RUNTIME_TOKEN:}"
    max-skew-seconds: "${PAYROLL_INTERNAL_MAX_SKEW_SECONDS:120}"
  db:
    url: "${PAYROLL_DB_URL:jdbc:h2:file:./data/payroll;DB_CLOSE_ON_EXIT=FALSE}"
    user: "${PAYROLL_DB_USER:sa}"
    password: "${PAYROLL_DB_PASSWORD:}"
  output-dir: "${PAYROLL_OUTPUT_DIR:output}"
  auth:
    enabled: "${PAYROLL_AUTH_ENABLED:true}"
    admin-password: "${PAYROLL_ADMIN_PASSWORD:admin123}"
  security:
    # 同一账号连续失败达到阈值后锁定，Redis 不可用时回退进程内计数。
    login-max-failures: "${PAYROLL_LOGIN_MAX_FAILURES:5}"
    login-lock-minutes: "${PAYROLL_LOGIN_LOCK_MINUTES:5}"
  chat:
    # 单个用户同时进行的流式生成数，超出返回 429。
    max-concurrent-per-user: "${PAYROLL_CHAT_MAX_CONCURRENT:2}"
    # 对话附件：只支持 Word/Excel/图片，原文件与提取文本落在独立目录。
    attachment:
      dir: "${PAYROLL_CHAT_ATTACHMENT_DIR:./data/chat-uploads}"
      max-files: "${PAYROLL_CHAT_ATTACHMENT_MAX_FILES:5}"
      max-file-bytes: "${PAYROLL_CHAT_ATTACHMENT_MAX_FILE_BYTES:20971520}"
      # 附件解析线程数与等待队列容量；队列满时该附件直接置为失败，前端可重新识别。
      parse-threads: "${PAYROLL_CHAT_ATTACHMENT_PARSE_THREADS:2}"
      parse-capacity: "${PAYROLL_CHAT_ATTACHMENT_PARSE_CAPACITY:100}"
    # 同一会话跨实例互斥锁的过期时间；需大于单轮回答的最长耗时（SSE 超时 10 分钟）。
    session-lock-minutes: "${PAYROLL_CHAT_SESSION_LOCK_MINUTES:15}"
    # 进程内会话运行时缓存上限与空闲淘汰时间；淘汰后按数据库上下文重建。
    cache-max-sessions: "${PAYROLL_CHAT_CACHE_MAX_SESSIONS:200}"
    cache-idle-minutes: "${PAYROLL_CHAT_CACHE_IDLE_MINUTES:60}"
    # 轮次租约：TTL 30 秒、10 秒心跳；节点崩溃后最多 30 秒可被接管。
    turn-lease-seconds: "${PAYROLL_TURN_LEASE_TTL_SECONDS:30}"
    turn-heartbeat-seconds: "${PAYROLL_TURN_HEARTBEAT_SECONDS:10}"
    # 事件流保留与单轮上限；续流窗口由 TTL 决定。
    turn-event-ttl-hours: "${PAYROLL_TURN_EVENT_TTL_HOURS:24}"
    turn-event-max: "${PAYROLL_TURN_EVENT_MAXLEN:10000}"
    # 历史轮次清理：启动后最多 5 分钟首次执行，之后按周期删除超过保留天数的行；
    # 周期 <= 0 关闭；只有 web/all 节点会执行，runtime 节点不重复扫库。
    turn-retention-days: "${PAYROLL_TURN_RETENTION_DAYS:90}"
    turn-cleanup-interval-minutes: "${PAYROLL_TURN_CLEANUP_INTERVAL_MINUTES:360}"
    # 写操作确认：关闭时写工具按旧行为直接执行，仅输出 WARN 便于灰度核对。
    action-confirm:
      enabled: "${PAYROLL_ACTION_CONFIRM_ENABLED:false}"
      ttl-minutes: "${PAYROLL_ACTION_PROPOSAL_TTL_MINUTES:15}"
      # 命中清单的写工具无论 enabled 如何都先出确认提案；默认覆盖知识库 6 个写工具。
      # skill_run、request_confirmation 与 request_input 额外由代码强制加入（不可通过配置移除）。
      always-confirm-tools: "${PAYROLL_ACTION_CONFIRM_ALWAYS_TOOLS:kb_create_library,kb_save_config,kb_grant_member,kb_remove_member,kb_move_directory,kb_rebuild_index,skill_run}"
    # 知识库 L0 确定性路由：enabled=false 时与旧 KbChatIntent 判定完全一致，便于灰度对比。
    kb-policy:
      enabled: "${PAYROLL_KB_POLICY_ENABLED:false}"
      follow-up: "${PAYROLL_KB_POLICY_FOLLOW_UP:true}"
      bound-candidate: "${PAYROLL_KB_POLICY_BOUND_CANDIDATE:false}"
      action-guard: "${PAYROLL_KB_POLICY_ACTION_GUARD:true}"
      follow-up-max-chars: "${PAYROLL_KB_POLICY_FOLLOW_UP_MAX_CHARS:20}"
    # 方案 B（docs/kb-retrieval-as-context-spec.md）：need_kb 只决定是否提供材料，
    # 不再把执行者改成 PayrollKbAgent；置 false 即回到改造前行为。
    kb-executor:
      enabled: "${PAYROLL_KB_EXECUTOR_ENABLED:false}"
    # 检索即上下文：单智能体无 kb:read 时服务端预取一次 kb_search 并注入有界材料。
    # B1 需在 #149（提示注入防护）完成后才可开启；关闭时只多一次布尔判断。
    kb-context:
      enabled: "${PAYROLL_KB_CONTEXT_ENABLED:false}"
      max-results: "${PAYROLL_KB_CONTEXT_MAX_RESULTS:3}"
      snippet-chars: "${PAYROLL_KB_CONTEXT_SNIPPET_CHARS:200}"
      max-chars: "${PAYROLL_KB_CONTEXT_MAX_CHARS:900}"
      min-score: "${PAYROLL_KB_CONTEXT_MIN_SCORE:0.0}"
      min-overlap-terms: "${PAYROLL_KB_CONTEXT_MIN_OVERLAP_TERMS:1}"
      timeout-ms: "${PAYROLL_KB_CONTEXT_TIMEOUT_MS:2000}"
      # B2：只展示正文 [n] 实际引用的材料条目，保持注入序号不重排。
      citation-filter:
        enabled: "${PAYROLL_KB_CONTEXT_CITATION_FILTER_ENABLED:false}"
      # B2：创作类问题提示词要求 need_kb=false，改变路由分布前需重跑金标。
      creative-no-kb: "${PAYROLL_KB_CONTEXT_CREATIVE_NO_KB:false}"
  # 路由透明化：每轮记录实际链路（PIPELINE/AGENT/FLOW/GRAPH/TEAM_ACTIVE）并随消息落库。
  routing:
    enabled: "${PAYROLL_ROUTING_ENABLED:true}"
  # 智能体路由：纯轻量模型决策单智能体/团队/流水线；失败或低置信度回退既有链路。
  router:
    enabled: "${PAYROLL_ROUTER_ENABLED:true}"
    timeout-ms: "${PAYROLL_ROUTER_TIMEOUT_MS:10000}"
    min-confidence: "${PAYROLL_ROUTER_MIN_CONFIDENCE:0.55}"
    # L1 语义路由：独立多语言嵌入模型与意图索引，只影响非薪酬轮次的 need_kb。
    semantic:
      enabled: "${PAYROLL_ROUTER_SEMANTIC_ENABLED:false}"
      min-score: "${PAYROLL_ROUTER_SEMANTIC_MIN_SCORE:0.50}"
      margin: "${PAYROLL_ROUTER_SEMANTIC_MARGIN:0.05}"
      index: "${PAYROLL_ROUTER_SEMANTIC_INDEX:payroll-route-intents}"
      timeout-ms: "${PAYROLL_ROUTER_SEMANTIC_TIMEOUT_MS:150}"
      seed-timeout-seconds: "${PAYROLL_ROUTER_SEMANTIC_SEED_TIMEOUT_SECONDS:60}"
      es-url: "${PAYROLL_ROUTER_SEMANTIC_ES_URL:${payroll.memory.es-url}}"
      es-username: "${PAYROLL_ROUTER_SEMANTIC_ES_USERNAME:${payroll.memory.es-username}}"
      es-password: "${PAYROLL_ROUTER_SEMANTIC_ES_PASSWORD:${payroll.memory.es-password}}"
      embedding-base-url: "${OLLAMA_BASE_URL:http://localhost:11434}"
      embedding-model: "${PAYROLL_ROUTER_SEMANTIC_EMBEDDING_MODEL:qwen3-embedding:0.6b}"
      embedding-dim: "${PAYROLL_ROUTER_SEMANTIC_EMBEDDING_DIM:1024}"
      # 薪酬语义桶（规格 7）：off 不启用；shadow 只比对；cache 才复用决策。
      payroll-mode: "${PAYROLL_ROUTER_SEMANTIC_PAYROLL_MODE:off}"
      payroll-index: "${PAYROLL_ROUTER_SEMANTIC_PAYROLL_INDEX:payroll-route-intents-payroll}"
      payroll-cache-ttl-days: "${PAYROLL_ROUTER_SEMANTIC_PAYROLL_CACHE_TTL_DAYS:7}"
  mcp:
    # 是否采纳外部服务的 readOnlyHint；false 时所有 MCP 工具一律视为写，逐个确认。
    trust-read-only-hints: "${PAYROLL_MCP_TRUST_READ_ONLY_HINTS:true}"
  tools:
    # 单工具分类覆盖，优先级最高；键为工具名，值为 READ_ONLY 或 MUTATING。
    safety-overrides: {}
  # 审计日志保留天数，启动时清理更早的记录。
  audit:
    retention-days: "${PAYROLL_AUDIT_RETENTION_DAYS:180}"
  # 动态团队：OFF=保持旧链路；STATIC=只记录静态运行；SHADOW/ACTIVE 由后续阶段启用。
  team:
    mode: "${PAYROLL_TEAM_MODE:ACTIVE}"
    retention-days: "${PAYROLL_TEAM_RETENTION_DAYS:180}"
    stats-window-days: "${PAYROLL_TEAM_STATS_WINDOW_DAYS:30}"
    shadow-sample-rate: "${PAYROLL_TEAM_SHADOW_SAMPLE_RATE:1.0}"
    # ACTIVE 灰度白名单：逗号分隔的 ID；留空表示该维度不限（两个都空=全量）。
    active-user-ids: "${PAYROLL_TEAM_ACTIVE_USER_IDS:}"
    active-session-ids: "${PAYROLL_TEAM_ACTIVE_SESSION_IDS:}"
  # 向量记忆：只索引用户问题与压缩摘要；默认只在当前会话内召回，避免不同角色串线。
  memory:
    enabled: "${PAYROLL_MEMORY_ENABLED:true}"
    es-url: "${PAYROLL_MEMORY_ES_URL:http://localhost:9200}"
    es-username: "${PAYROLL_MEMORY_ES_USERNAME:}"
    es-password: "${PAYROLL_MEMORY_ES_PASSWORD:}"
    index: "${PAYROLL_MEMORY_INDEX:payroll-chat-memory}"
    embedding-base-url: "${OLLAMA_BASE_URL:http://localhost:11434}"
    embedding-model: "${PAYROLL_MEMORY_EMBEDDING_MODEL:nomic-embed-text}"
    embedding-dim: "${PAYROLL_MEMORY_EMBEDDING_DIM:768}"
    embed-timeout: "${PAYROLL_MEMORY_EMBED_TIMEOUT:3s}"
    top-k: "${PAYROLL_MEMORY_TOP_K:5}"
    min-score: "${PAYROLL_MEMORY_MIN_SCORE:0.55}"
    max-inject-chars: "${PAYROLL_MEMORY_MAX_INJECT_CHARS:1200}"
    async-index: "${PAYROLL_MEMORY_ASYNC_INDEX:true}"
    # false=只召回当前会话（默认）；true=允许跨会话召回同一用户的历史问题。
    cross-session: "${PAYROLL_MEMORY_CROSS_SESSION:false}"
    # 用户级工作偏好（对外「我的工作偏好」）：默认关闭；runtime/all 抽取，web/all 清理凭证。
    profile:
      enabled: "${PAYROLL_PROFILE_MEMORY_ENABLED:false}"
      max-items-per-extraction: "${PAYROLL_PROFILE_MAX_ITEMS:3}"
      inject-max-items: "${PAYROLL_PROFILE_INJECT_MAX_ITEMS:10}"
      inject-max-chars: "${PAYROLL_PROFILE_INJECT_MAX_CHARS:600}"
  # 语义缓存：默认关闭；只缓存 AGENT 路径无工具调用的稳定问答。
  semantic-cache:
    enabled: "${PAYROLL_SEMANTIC_CACHE_ENABLED:false}"
    index: "${PAYROLL_SEMANTIC_CACHE_INDEX:payroll-semantic-cache-v1}"
    threshold: "${PAYROLL_SEMANTIC_CACHE_THRESHOLD:0.95}"
    ttl-minutes: "${PAYROLL_SEMANTIC_CACHE_TTL_MINUTES:30}"
    max-entries: "${PAYROLL_SEMANTIC_CACHE_MAX_ENTRIES:10000}"
  # 知识库对话工具：runtime 通过签名内部接口调用 Web 侧知识库服务。
  kb-skill:
    enabled: "${PAYROLL_KB_SKILL_ENABLED:true}"
    # runtime 可见的 Web 节点地址，逗号分隔；本地单机默认 8080。
    web-urls: "${PAYROLL_WEB_NODE_URLS:http://127.0.0.1:8080}"
  # 知识库：文件落盘、解析分块、ES 索引与 Ollama 回答生成。
  kb:
    storage-dir: "${PAYROLL_KB_STORAGE_DIR:./data/kb-uploads}"
    max-file-size: "${PAYROLL_KB_MAX_FILE_SIZE:629145600}"
    max-batch-size: "${PAYROLL_KB_MAX_BATCH:50}"
    max-directory-depth: "${PAYROLL_KB_MAX_DIR_DEPTH:5}"
    es-enabled: "${PAYROLL_KB_ES_ENABLED:true}"
    es-url: "${PAYROLL_KB_ES_URL:${payroll.memory.es-url}}"
    es-username: "${PAYROLL_KB_ES_USERNAME:${payroll.memory.es-username}}"
    es-password: "${PAYROLL_KB_ES_PASSWORD:${payroll.memory.es-password}}"
    es-index: "${PAYROLL_KB_ES_INDEX:payroll-kb-chunks}"
    embedding-base-url: "${OLLAMA_BASE_URL:http://localhost:11434}"
    embedding-model: "${PAYROLL_KB_EMBEDDING_MODEL:nomic-embed-text}"
    embedding-dim: "${PAYROLL_KB_EMBEDDING_DIM:768}"
    answer-enabled: "${PAYROLL_KB_ANSWER_ENABLED:true}"
    answer-model: "${PAYROLL_KB_ANSWER_MODEL:qwen2.5:3b-instruct}"
    answer-timeout: "${PAYROLL_KB_ANSWER_TIMEOUT:120s}"
    task-threads: "${PAYROLL_KB_TASK_THREADS:2}"
    # 单个入库任务链最多重试次数，达到上限后仅保留终态等待人工排查。
    task-max-retries: "${PAYROLL_KB_TASK_MAX_RETRIES:3}"
    # 启动时恢复重启遗留的排队/运行中任务；关闭后遗留任务保持原状。
    recovery-enabled: "${PAYROLL_KB_RECOVERY_ENABLED:true}"
    # 扫描件兜底：无文字层页面按页渲染后交给 OCR；max-pages=0 表示不限页数。
    ocr:
      enabled: "${PAYROLL_KB_OCR_ENABLED:true}"
      command: "${PAYROLL_KB_OCR_COMMAND:tesseract}"
      tessdata-dir: "${PAYROLL_KB_OCR_TESSDATA:}"
      languages: "${PAYROLL_KB_OCR_LANGUAGES:chi_sim+eng}"
      dpi: "${PAYROLL_KB_OCR_DPI:300}"
      timeout-seconds: "${PAYROLL_KB_OCR_TIMEOUT:120}"
      max-pages: "${PAYROLL_KB_OCR_MAX_PAGES:0}"
      # 档位链：rapidocr（主档，需 -Prapidocr 构建）→ tesseract（降级档）；
      # 也可设为 rapidocr 或 tesseract 只用单档。每档结果先过质量门，未通过自动降级。
      engine: "${PAYROLL_KB_OCR_ENGINE:chain}"
      chain-order: "${PAYROLL_KB_OCR_CHAIN_ORDER:rapidocr,tesseract}"
      cache-size: "${PAYROLL_KB_OCR_CACHE_SIZE:32}"
      breaker-failures: "${PAYROLL_KB_OCR_BREAKER_FAILURES:3}"
      breaker-cooldown-seconds: "${PAYROLL_KB_OCR_BREAKER_COOLDOWN:60}"
      # 质量门阈值（黄金集校准）；min-cjk-ratio=0 表示不强制中文占比。
      quality-gate:
        min-chars: "${PAYROLL_KB_OCR_GATE_MIN_CHARS:8}"
        min-alnum-ratio: "${PAYROLL_KB_OCR_GATE_MIN_ALNUM:0.5}"
        min-cjk-ratio: "${PAYROLL_KB_OCR_GATE_MIN_CJK:0}"
        min-confidence: "${PAYROLL_KB_OCR_GATE_MIN_CONFIDENCE:0}"
      rapidocr:
        enabled: "${PAYROLL_KB_OCR_RAPIDOCR_ENABLED:true}"
        # 原生库与模型解压到该目录下的 ocrJava；默认落在系统临时目录。
        model-dir: "${PAYROLL_KB_OCR_RAPIDOCR_MODEL_DIR:${java.io.tmpdir}}"
        timeout-seconds: "${PAYROLL_KB_OCR_RAPIDOCR_TIMEOUT:60}"
    # 会话绑定知识库：单会话最多绑定库数；未绑定时默认检索的可读库上限；团队节点检索开关。
    chat:
      max-series: "${PAYROLL_KB_CHAT_MAX_SERIES:3}"
      auto-max-series: "${PAYROLL_KB_CHAT_AUTO_MAX_SERIES:5}"
      team-enabled: "${PAYROLL_KB_CHAT_TEAM_ENABLED:true}"
    # 多路召回与知识点融合；fusion-enabled=false 时退回旧的向量+BM25 加权求和。
    retrieval:
      fusion-enabled: "${PAYROLL_KB_RETRIEVAL_FUSION:true}"
      recall-routes: "${PAYROLL_KB_RETRIEVAL_ROUTES:VECTOR,BM25,TITLE_PATH}"
      rrf-k: "${PAYROLL_KB_RETRIEVAL_RRF_K:60}"
      vector-weight: "${PAYROLL_KB_RETRIEVAL_VECTOR_WEIGHT:1.0}"
      bm25-weight: "${PAYROLL_KB_RETRIEVAL_BM25_WEIGHT:0.8}"
      title-weight: "${PAYROLL_KB_RETRIEVAL_TITLE_WEIGHT:0.5}"
      keyword-threshold: "${PAYROLL_KB_RETRIEVAL_KEYWORD_THRESHOLD:0.3}"
      title-threshold: "${PAYROLL_KB_RETRIEVAL_TITLE_THRESHOLD:0.3}"
      max-per-document: "${PAYROLL_KB_RETRIEVAL_MAX_PER_DOC:3}"
      max-merge-chunks: "${PAYROLL_KB_RETRIEVAL_MAX_MERGE_CHUNKS:3}"

# logback.xml 默认 WARN（CLI 保持安静），管理台启动日志需要 INFO。
logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: payroll-agent
