<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 薪酬智能体</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-main">
  <form id="login-form" class="login-card">
    <div class="login-brand">
      <div class="brand-mark">薪</div>
      <h1>薪酬智能体</h1>
      <p class="hint">Payroll Agent Console · 多用户协同</p>
    </div>
    <label>用户名<input name="username" autocomplete="username" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="login-error hidden"></p>
    <button type="submit" id="login-submit" class="primary">登录</button>
    <p class="hint login-hint">首次启动默认管理员 admin / admin123，登录后请立即修改密码。</p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
